<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 批改評分工具</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand__title">RAI/AIEC 評測工具</span>
        <span class="brand__subtitle">批改管理</span>
      </div>
      <div class="header-actions">
        <button class="btn btn--ghost" type="button">通知</button>
        <button class="btn btn--primary" type="button">登入或建立帳號</button>
      </div>
    </header>

    <main class="app-main">
      <section class="filter-bar" aria-label="批改條件">
        <div class="filter-bar__group">
          <label class="filter-bar__label" for="session-select">考試場次</label>
          <select id="session-select" class="filter-bar__control">
            <option>112 年 5 月教師甄試</option>
            <option>112 年 11 月教師甄試</option>
            <option>113 年模擬試</option>
          </select>
        </div>
        <div class="filter-bar__group">
          <label class="filter-bar__label" for="paper-select">考卷類型</label>
          <select id="paper-select" class="filter-bar__control">
            <option>國語文閱讀測驗</option>
            <option>國語文作文</option>
            <option>數理邏輯</option>
          </select>
        </div>
        <div class="filter-bar__group">
          <label class="filter-bar__label" for="grader-select">批改老師</label>
          <select id="grader-select" class="filter-bar__control">
            <option>全部老師</option>
            <option>林老師</option>
            <option>張老師</option>
            <option>楊老師</option>
          </select>
        </div>
        <div class="filter-bar__group">
          <label class="filter-bar__label" for="status-select">批改狀態</label>
          <select id="status-select" class="filter-bar__control">
            <option>全部狀態</option>
            <option>待批改</option>
            <option>退回重批</option>
            <option>已完成</option>
          </select>
        </div>
        <div class="filter-bar__actions">
          <button class="btn btn--outline" type="button">匯出報表</button>
          <button class="btn btn--primary" type="button">新增批改任務</button>
        </div>
      </section>

      <div class="dashboard">
        <aside class="panel" aria-label="考生清單">
          <header class="panel__header">
            <div>
              <h2 class="panel__title">考生列表</h2>
              <p class="panel__subtitle">共 24 筆資料 · 按批改進度排序</p>
            </div>
            <div class="panel__tools">
              <button class="icon-button" type="button" aria-label="搜尋考生">
                <span class="material-symbol">search</span>
              </button>
              <button class="icon-button" type="button" aria-label="重新整理">
                <span class="material-symbol">refresh</span>
              </button>
            </div>
          </header>

          <div class="table-wrapper">
            <table class="data-table" id="candidate-table">
              <thead>
                <tr>
                  <th scope="col">考生</th>
                  <th scope="col">AI 初評</th>
                  <th scope="col">老師批改</th>
                  <th scope="col">狀態</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </aside>

        <section class="panel panel--wide" aria-label="批改詳情">
          <header class="panel__header">
            <div>
              <h2 class="panel__title">批改內容</h2>
              <p class="panel__subtitle" id="candidate-name">請先選擇左側考生</p>
            </div>
            <div class="panel__tools">
              <button class="btn btn--ghost" type="button">退回重批</button>
              <button class="btn btn--primary" type="button">送出成績</button>
            </div>
          </header>

          <div class="detail-layout">
            <div class="detail-layout__left">
              <section class="info-card">
                <h3 class="info-card__title">考生資訊</h3>
                <dl class="info-grid" id="candidate-info">
                  <div>
                    <dt>准考證號</dt>
                    <dd>—</dd>
                  </div>
                  <div>
                    <dt>身份證號</dt>
                    <dd>—</dd>
                  </div>
                  <div>
                    <dt>分發老師</dt>
                    <dd>—</dd>
                  </div>
                  <div>
                    <dt>AI 建議等級</dt>
                    <dd>—</dd>
                  </div>
                </dl>
              </section>

              <section class="info-card">
                <header class="info-card__header">
                  <h3 class="info-card__title">題目列表</h3>
                  <div class="legend">
                    <span class="legend__item legend__item--ai">AI 建議</span>
                    <span class="legend__item legend__item--manual">人工評分</span>
                  </div>
                </header>
                <div class="table-wrapper table-wrapper--compact">
                  <table class="data-table" id="question-table">
                    <thead>
                      <tr>
                        <th scope="col">題號</th>
                        <th scope="col">AI 評分</th>
                        <th scope="col">老師評分</th>
                        <th scope="col">備註</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </section>
            </div>

            <div class="detail-layout__right">
              <section class="info-card info-card--essay">
                <header class="info-card__header">
                  <div>
                    <h3 class="info-card__title">考生作答</h3>
                    <p class="info-card__subtitle" id="question-title"></p>
                  </div>
                  <div class="toggle-group" role="group" aria-label="評分模式">
                    <button class="toggle is-active" data-view="essay">作答內容</button>
                    <button class="toggle" data-view="ai">AI 建議</button>
                    <button class="toggle" data-view="rubric">評分規準</button>
                  </div>
                </header>
                <article class="essay-view" id="essay-view"></article>
              </section>

              <section class="info-card">
                <header class="info-card__header">
                  <h3 class="info-card__title">批改紀錄</h3>
                  <button class="btn btn--ghost btn--small" type="button">新增備註</button>
                </header>
                <ul class="timeline" id="timeline"></ul>
              </section>
            </div>
          </div>
        </section>
      </div>
    </main>

    <template id="candidate-row">
      <tr>
        <th scope="row">
          <div class="candidate">
            <span class="candidate__name"></span>
            <span class="candidate__id"></span>
          </div>
        </th>
        <td><span class="badge badge--ai"></span></td>
        <td><span class="badge badge--manual"></span></td>
        <td><span class="status-pill"></span></td>
      </tr>
    </template>

    <template id="question-row">
      <tr>
        <th scope="row"></th>
        <td>
          <span class="score"></span>
          <span class="score-trend"></span>
        </td>
        <td>
          <span class="score"></span>
          <span class="score-trend"></span>
        </td>
        <td class="note"></td>
      </tr>
    </template>

    <template id="timeline-item">
      <li class="timeline__item">
        <span class="timeline__time"></span>
        <div class="timeline__content">
          <p class="timeline__title"></p>
          <p class="timeline__description"></p>
        </div>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
