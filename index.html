<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>題庫健康水位監控儀表板</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="hero">
      <nav class="topbar" aria-label="主要導覽">
        <div class="brand">
          <span class="brand__mark">AIEC</span>
          <div>
            <p class="brand__eyebrow">Question Bank Ops</p>
            <h1>題庫健康水位監控儀表板</h1>
          </div>
        </div>
        <div class="topbar__actions">
          <span class="sync-pill">前端展示版 · 可串接 API</span>
          <button class="btn btn--ghost" type="button">匯出 PDF</button>
        </div>
      </nav>

      <section class="hero__content">
        <div>
          <p class="section-kicker">資安 · 公平 · 隱私</p>
          <h2>用兩條安全水位線，即時掌握各難易度題數是否足夠。</h2>
          <p>
            以難易度為 X 軸，將各評估面向的長條圖依子指標切分；同時比對「單張考卷配比安全線」與「下月專案需求安全線」，協助提早發現題庫缺口。
          </p>
        </div>
        <div class="hero-card" aria-label="整體健康狀態摘要">
          <span>整體健康分數</span>
          <strong id="overall-score">—</strong>
          <small id="overall-description">計算中</small>
        </div>
      </section>
    </header>

    <main class="app-shell">
      <section class="control-panel" aria-label="監控參數設定">
        <div class="control-panel__header">
          <div>
            <p class="section-kicker">Dashboard Controls</p>
            <h2>監控參數</h2>
          </div>
          <button class="btn btn--primary" id="reset-button" type="button">還原預設值</button>
        </div>

        <div class="control-grid">
          <label class="field">
            <span>預估下月專案數量</span>
            <input id="project-count" type="number" min="1" max="60" value="12" />
            <small>用來計算第二條「專案需求安全線」。</small>
          </label>
          <label class="field">
            <span>每個專案預估考卷份數</span>
            <input id="papers-per-project" type="number" min="1" max="80" value="8" />
            <small>專案數 × 考卷份數 × 每卷該面向題數。</small>
          </label>
          <label class="field">
            <span>每張考卷總題數</span>
            <input id="questions-per-paper" type="number" min="5" max="80" value="20" />
            <small>搭配三個評估面向的比例，推估基本水位。</small>
          </label>
          <label class="field">
            <span>題目重複使用緩衝係數</span>
            <input id="reuse-buffer" type="number" min="1" max="8" step="0.5" value="3" />
            <small>數值越高，代表需準備更多不同題目。</small>
          </label>
        </div>
      </section>

      <section class="summary-grid" id="summary-grid" aria-label="三大評估面向摘要"></section>

      <section class="dashboard-grid" id="dimension-panels" aria-label="題庫健康水位圖表"></section>

      <section class="insight-panel" aria-label="補題優先順序">
        <div>
          <p class="section-kicker">Action Items</p>
          <h2>補題優先順序</h2>
          <p>依據目前題庫數量與兩條安全水位線的差距，自動列出最需要補強的面向與難易度。</p>
        </div>
        <ol class="priority-list" id="priority-list"></ol>
      </section>
    </main>

    <template id="summary-card-template">
      <article class="summary-card">
        <div class="summary-card__topline">
          <span class="summary-card__icon"></span>
          <span class="summary-card__status"></span>
        </div>
        <h3></h3>
        <p></p>
        <div class="summary-card__metrics">
          <div><strong data-total></strong><span>總題數</span></div>
          <div><strong data-paper-line></strong><span>考卷水位</span></div>
          <div><strong data-demand-line></strong><span>需求水位</span></div>
        </div>
      </article>
    </template>

    <template id="dimension-panel-template">
      <article class="dimension-panel">
        <header class="dimension-panel__header">
          <div>
            <p class="section-kicker"></p>
            <h2></h2>
          </div>
          <div class="health-badge"></div>
        </header>
        <div class="chart-wrap">
          <div class="chart-y-axis" aria-hidden="true"></div>
          <div class="bar-chart"></div>
        </div>
        <div class="legend-row"></div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
